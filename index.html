<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NYC 2026 — Neon Rooftops</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080d21;color:#f4f7ff;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:fixed;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;text-shadow:0 2px 8px #000}
#brand{font-size:clamp(16px,2vw,25px);font-weight:900;letter-spacing:.1em}#brand span{color:#56e5ff}
#stats{font-weight:800;display:flex;gap:18px;font-size:clamp(14px,1.7vw,20px)}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(120deg,#080c20cc,#22113dcc);backdrop-filter:blur(5px);padding:24px}
.panel{max-width:620px;text-align:center;background:#0a1034dc;border:1px solid #80d9ff55;box-shadow:0 30px 120px #000b,0 0 70px #2d86fa22;padding:clamp(22px,5vw,55px);border-radius:24px}
.kicker{color:#67e7ff;letter-spacing:.35em;font-size:12px;font-weight:900}.panel h1{font-size:clamp(38px,7vw,70px);line-height:1;margin:14px 0;background:linear-gradient(90deg,#fff,#ff73d7,#65ecff);background-clip:text;color:transparent}
.panel p{color:#c9d5ed;line-height:1.6}button{cursor:pointer;border:0;border-radius:12px;background:linear-gradient(95deg,#ff4ca8,#7d68ff);box-shadow:0 9px 35px #ff3d9c55;color:#fff;font-weight:900;padding:16px 32px;font-size:17px}
small{display:block;color:#8798c2;margin-top:22px}#touch{position:fixed;bottom:25px;left:20px;right:20px;display:none;justify-content:space-between;pointer-events:none}
.group{display:flex;gap:12px}.touchbtn{pointer-events:auto;width:68px;height:68px;border:2px solid #a2daff55;border-radius:22px;background:#0c214c99;color:white;font-size:27px;padding:0;box-shadow:none;touch-action:none;user-select:none}
@media(pointer:coarse){#touch{display:flex}small{font-size:12px}}
</style></head><body>
<canvas id="game" aria-label="NYC 2026 platformspil"></canvas>
<div id="hud"><div id="brand">NYC<span> / </span>2026 <div style="font-size:10px;letter-spacing:.25em;color:#a5b2e6">NEON ROOFTOPS</div></div><div id="stats"><span id="coins">◆ 0 / 0</span><span id="lives">♥ ♥ ♥</span></div></div>
<div id="overlay"><div class="panel"><div class="kicker">WELCOME TO THE CONCRETE JUNGLE</div><h1 id="heading">NEON<br>ROOFTOPS</h1><p id="message">Spring over Manhattans hustage, saml lysende krystaller, undgå droner og nå metroportalen, før natten er omme.</p><button id="start">START SPILLET →</button><small>← → / A D = bevæg · Space / W / ↑ = hop · R = genstart · P = pause</small></div></div>
<div id="touch"><div class="group"><button class="touchbtn" data-key="ArrowLeft">◀</button><button class="touchbtn" data-key="ArrowRight">▶</button></div><div class="group"><button class="touchbtn" data-key="Space">↑</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),heading=document.querySelector('#heading'),message=document.querySelector('#message'),start=document.querySelector('#start'),coinHud=document.querySelector('#coins'),lifeHud=document.querySelector('#lives');
let W=1280,H=720,dpr=1,scale=1,offsetX=0,offsetY=0,camera=0,clock=0,started=false,paused=false,won=false,shakes=0;
const WORLD=5900,GROUND=610,keys=new Set(),particles=[],stars=[],buildings=[];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
for(let i=0;i<90;i++)stars.push({x:rand(0,2200),y:rand(20,340),r:rand(.4,1.8),p:rand(0,6)});
for(let layer=0;layer<3;layer++){const arr=[];for(let x=-100;x<8000;){const w=rand(55,150);arr.push({x,w,h:rand(100+layer*20,330+layer*70),light:Math.random()});x+=w+rand(4,20)}buildings.push(arr)}
const platforms=[
{x:0,y:610,w:670},{x:770,y:575,w:380},{x:1250,y:620,w:480},{x:1835,y:565,w:340},{x:2290,y:610,w:480},{x:2880,y:555,w:450},{x:3430,y:610,w:460},{x:4010,y:565,w:380},{x:4500,y:610,w:460},{x:5070,y:560,w:830},
{x:360,y:465,w:170},{x:880,y:435,w:160},{x:1420,y:465,w:155},{x:1970,y:400,w:175},{x:2470,y:450,w:165},{x:3050,y:415,w:175},{x:3590,y:475,w:155},{x:4180,y:400,w:170},{x:4720,y:465,w:175},{x:5330,y:405,w:160}];
const spikes=[{x:545,y:592,w:92},{x:1590,y:602,w:90},{x:2580,y:592,w:85},{x:3690,y:592,w:90},{x:4750,y:592,w:94}];
let player,coins,enemies,checkpoint;
function newGame(){player={x:75,y:510,w:32,h:49,vx:0,vy:0,ground:false,coyote:0,jumpBuffer:0,canDouble:true,face:1,invuln:0,lives:3,score:0};camera=0;clock=0;shakes=0;won=false;checkpoint=75;particles.length=0;
coins=[];platforms.forEach((p,i)=>{if(i===0)return;const num=p.w>400?5:3;for(let j=0;j<num;j++)coins.push({x:p.x+35+j*(p.w-70)/Math.max(1,num-1),y:p.y-43-Math.sin(j*2)*15,taken:false,phase:rand(0,6)})});
enemies=[950,1480,2070,2550,3170,3770,4280,4820,5440].map((x,i)=>({x,y:0,base:x,phase:i*1.7,alive:true}));syncHud()}
function syncHud(){coinHud.textContent='◆ '+player.score+' / '+coins.length;lifeHud.textContent='♥ '.repeat(Math.max(0,player.lives))}
function show(title,desc,button){heading.innerHTML=title;message.textContent=desc;start.textContent=button;overlay.style.display='grid';started=false}
function begin(){newGame();overlay.style.display='none';started=true;paused=false;last=performance.now()}
function hurt(){if(player.invuln>0)return;player.lives--;player.invuln=1.8;shakes=16;burst(player.x+15,player.y+20,'#ff568d',18);syncHud();if(player.lives<=0){show('GAME OVER','New York sover aldrig. Prøv igen, og find en bedre rute.','PRØV IGEN →');return}player.x=checkpoint;player.y=360;player.vx=0;player.vy=0}
function burst(x,y,color,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-220,220),vy:rand(-290,70),life:rand(.3,.85),max:1,color,r:rand(2,5)})}
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);W=innerWidth;H=innerHeight;scale=Math.min(W/1280,H/720);offsetX=(W-1280*scale)/2;offsetY=(H-720*scale)/2}
addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='KeyR')begin();if(e.code==='KeyP'&&started){paused=!paused}if(['Space','ArrowUp','KeyW'].includes(e.code)&&player)player.jumpBuffer=.16});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();paused=true});
document.querySelectorAll('.touchbtn').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k);if(k==='Space'&&player)player.jumpBuffer=.16});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});
start.addEventListener('click',begin);
function update(dt){if(!started||paused)return;clock+=dt;shakes=Math.max(0,shakes-42*dt);const p=player;p.invuln=Math.max(0,p.invuln-dt);p.jumpBuffer=Math.max(0,p.jumpBuffer-dt);
const move=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0);
const target=move*330;p.vx+=(target-p.vx)*Math.min(1,dt*(p.ground?13:8));if(move)p.face=move;
p.coyote=p.ground?.105:Math.max(0,p.coyote-dt);
if(p.jumpBuffer>0&&(p.coyote>0||p.canDouble)){const first=p.coyote>0;p.vy=first?-675:-610;p.ground=false;p.coyote=0;if(!first){p.canDouble=false;burst(p.x+16,p.y+45,'#62eaff',12)}p.jumpBuffer=0}
p.vy=Math.min(1150,p.vy+1750*dt);const oldBottom=p.y+p.h;p.x=clamp(p.x+p.vx*dt,0,WORLD-p.w);p.y+=p.vy*dt;p.ground=false;
if(p.vy>=0)for(const plat of platforms){if(oldBottom<=plat.y+12&&p.y+p.h>=plat.y&&p.x+p.w>plat.x+5&&p.x<plat.x+plat.w-5){p.y=plat.y-p.h;p.vy=0;p.ground=true;p.canDouble=true;break}}
if(p.y>840)hurt();
for(const s of spikes)if(p.x+p.w>s.x+8&&p.x<s.x+s.w-8&&p.y+p.h>s.y-9&&p.y<s.y+20)hurt();
for(const c of coins){if(c.taken)continue;const cy=c.y+Math.sin(clock*4+c.phase)*7;if(Math.abs(p.x+16-c.x)<27&&Math.abs(p.y+24-cy)<35){c.taken=true;p.score++;burst(c.x,cy,'#ffd46d',9);syncHud()}}
for(const e of enemies){if(!e.alive)continue;e.x=e.base+Math.sin(clock*1.6+e.phase)*55;e.y=475+Math.sin(clock*2.9+e.phase)*37;if(Math.abs(p.x+16-e.x)<38&&Math.abs(p.y+24-e.y)<38){if(p.vy>100&&p.y+p.h<e.y+12){e.alive=false;p.vy=-450;burst(e.x,e.y,'#ef72ff',24)}else hurt()}}
if(p.x>1200&&checkpoint<1300)checkpoint=1280;if(p.x>2900&&checkpoint<3000)checkpoint=2970;if(p.x>4500&&checkpoint<4600)checkpoint=4550;
if(p.x>WORLD-175){won=true;show('YOU DID IT!','Du nåede den sidste metroportal med '+p.score+' af '+coins.length+' krystaller. New York er din!','SPIL IGEN →')}
camera+=(clamp(p.x-420,0,WORLD-1280)-camera)*Math.min(1,dt*5.5);
for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=650*dt;if(q.life<=0)particles.splice(i,1)}
}
function poly(points,fill){ctx.fillStyle=fill;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#080b22';ctx.fillRect(0,0,W,H);
ctx.translate(offsetX,offsetY);ctx.scale(scale,scale);
let bg=ctx.createLinearGradient(0,0,0,720);bg.addColorStop(0,'#091330');bg.addColorStop(.5,'#27205b');bg.addColorStop(1,'#ff6980');ctx.fillStyle=bg;ctx.fillRect(0,0,1280,720);
ctx.fillStyle='#fda4a5';ctx.shadowColor='#ff92a9';ctx.shadowBlur=65;ctx.beginPath();ctx.arc(970,280,65,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
for(const s of stars){ctx.globalAlpha=.3+.5*Math.sin(clock+s.p)**2;ctx.fillStyle='#d8eaff';ctx.beginPath();ctx.arc((s.x-camera*.07)%1400,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;
for(let l=0;l<3;l++){const par=[.12,.27,.43][l];for(const b of buildings[l]){const x=b.x-camera*par;if(x<-180||x>1400)continue;const top=630-b.h;ctx.fillStyle=['#1c2553','#172043','#101934'][l];ctx.fillRect(x,top,b.w,700-top);ctx.fillStyle=['#f5ae8b55','#8ec7f477','#e0a9f477'][l];for(let wy=top+17;wy<625;wy+=23)for(let wx=x+12;wx<x+b.w-8;wx+=21)if(Math.sin(wx*12.1+wy*21.9)>.25)ctx.fillRect(wx,wy,6,10)}} 
ctx.save();ctx.translate(-camera+rand(-shakes,shakes),rand(-shakes,shakes));
for(const plat of platforms){ctx.fillStyle='#0c1934';ctx.fillRect(plat.x,plat.y,plat.w,750-plat.y);ctx.fillStyle='#344967';ctx.fillRect(plat.x,plat.y,plat.w,15);ctx.fillStyle='#63b7ce';ctx.fillRect(plat.x,plat.y,plat.w,3);ctx.fillStyle='#1d3150';for(let j=15;j<plat.w;j+=54)ctx.fillRect(plat.x+j,plat.y+28,28,18);ctx.fillStyle='#0e1632';ctx.fillRect(plat.x+6,plat.y+15,plat.w-12,9)}
for(const s of spikes){for(let x=s.x;x<s.x+s.w;x+=18)poly([[x,s.y+18],[x+9,s.y-1],[x+18,s.y+18]],'#ff5c9b')}
for(const c of coins){if(c.taken)continue;const y=c.y+Math.sin(clock*4+c.phase)*7;ctx.shadowColor='#ffdd75';ctx.shadowBlur=19;poly([[c.x,y-12],[c.x+10,y],[c.x,y+12],[c.x-10,y]],'#ffe17b');ctx.shadowBlur=0;poly([[c.x,y-8],[c.x+6,y],[c.x,y+8],[c.x-6,y]],'#fff9d0')}
for(const e of enemies){if(!e.alive)continue;ctx.shadowColor='#e855ff';ctx.shadowBlur=25;rounded(e.x-25,e.y-17,50,34,12,'#722cbd');ctx.shadowBlur=0;rounded(e.x-16,e.y-6,32,12,6,'#261242');ctx.fillStyle='#ff6d9e';ctx.fillRect(e.x-10,e.y-3,8,5);ctx.fillRect(e.x+4,e.y-3,8,5);ctx.fillStyle='#a3b9fc';ctx.fillRect(e.x-38,e.y-3,13,5);ctx.fillRect(e.x+25,e.y-3,13,5)}
const p=player;if(p&&(p.invuln<=0||Math.floor(clock*14)%2===0)){ctx.save();ctx.translate(p.x+16,p.y+25);ctx.scale(p.face,1);ctx.shadowColor='#32d9ff';ctx.shadowBlur=15;rounded(-14,-15,28,38,7,'#37d9ee');ctx.shadowBlur=0;rounded(-18,-26,36,27,10,'#f2b4a0');poly([[-20,-25],[-3,-39],[18,-31],[22,-18],[-9,-22]],'#26204e');rounded(2,-19,11,6,3,'#edfbff');ctx.fillStyle='#fa539b';ctx.fillRect(-13,21,11,10);ctx.fillRect(4,21,11,10);ctx.restore()}
for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.shadowColor=q.color;ctx.shadowBlur=10;ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;
const portalX=WORLD-125;ctx.shadowColor='#6deaff';ctx.shadowBlur=33;rounded(portalX,445,65,115,30,'#5b52e9');rounded(portalX+12,458,41,93,20,'#081a49');ctx.shadowBlur=0;ctx.fillStyle='#c5efff';ctx.font='bold 19px system-ui';ctx.fillText('MTA',portalX+12,431);
ctx.restore();
const v=ctx.createRadialGradient(640,330,200,640,330,850);v.addColorStop(0,'#06071700');v.addColorStop(1,'#05071c99');ctx.fillStyle=v;ctx.fillRect(0,0,1280,720);
if(paused&&started){ctx.fillStyle='#071026ba';ctx.fillRect(0,0,1280,720);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 50px system-ui';ctx.fillText('PAUSE',640,340);ctx.font='20px system-ui';ctx.fillText('Tryk P for at fortsætte',640,386);ctx.textAlign='left'}
}
let last=performance.now();function frame(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}newGame();requestAnimationFrame(frame);
})();
</script></body></html>
